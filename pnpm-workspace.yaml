packages:
  - 'library'
  - 'examples/client/*'
  - 'examples/server/*'

# Security overrides for transitive dependencies (see CHANGELOG / audit-ci.jsonc).
# pnpm 10 reads overrides from here, not from the "pnpm" field in package.json.
overrides:
  brace-expansion@<5.0.12: 5.0.12
  form-data@<4.0.6: 4.0.6
  nanoid@<3.3.18: 3.3.18
  source-map-js@<1.2.2: 1.2.2
  qs@<6.16.0: 6.16.0
  proxy-addr@<2.0.8: 2.0.8
  body-parser@<2.3.0: 2.3.0
